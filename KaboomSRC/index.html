<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miloboom Minecraft Server</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 50px 0;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .connect-btn {
            background-color: #00ff94;
            color: #000;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
        }
        .connect-btn:hover {
            background-color: #00cc78;
        }
        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #bbb;
        }
    </style>

    <header>
        <h1>Miloboom Minecraft Server</h1>

    </footer>
